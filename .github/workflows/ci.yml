name: Windows picker watchdog checks
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Commit to test
        required: true
permissions:
  contents: read
jobs:
  picker:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.16.0
          use-cache: false
      - name: Verify case and protocol watchdogs
        shell: bash
        run: |
          set -eu
          mkdir watchdog
          cp scripts/recording_test_runner.zig scripts/test_id_record.zig watchdog/
          cd watchdog
          cat >fixture.zig <<'ZIG'
          test "first completes" {}
          test "hangs" {
              while (true) @import("std").atomic.spinLoopHint();
          }
          test "last completes" {}
          ZIG
          cat >build.zig <<'ZIG'
          const std = @import("std");
          pub fn build(b: *std.Build) void {
              const artifact = b.addTest(.{ .name = "picker-test", .root_module = b.createModule(.{ .root_source_file = b.path("fixture.zig"), .target = b.graph.host }), .test_runner = .{ .path = b.path("recording_test_runner.zig"), .mode = .server } });
              b.step("test", "Run watchdog fixture").dependOn(&b.addRunArtifact(artifact).step);
          }
          ZIG
          check_timeout() {
            export METACODES_PICKER_TRACE="$1.log"
            rc=0
            zig build test --test-timeout 2s --summary all > "$1-build.log" 2>&1 || rc=$?
            cat "$1-build.log" "$1.log"
            test "$rc" -eq 1
          }
          check_timeout wedged-case
          grep -F 'fixture.test.hangs' wedged-case-build.log | grep -F 'timed out after'
          grep -F $'started\tfixture.test.hangs' wedged-case.log
          grep -F $'pass\tfixture.test.last completes' wedged-case.log
          test "$(grep -c '^server starting' wedged-case.log)" -eq 2
          grep -F 'exiting' wedged-case.log
          python - <<'PYTHON'
          from pathlib import Path
          p = Path("recording_test_runner.zig")
          s = p.read_text()
          pos = 'try trace("sending metadata", "");'
          assert s.count(pos) == 1
          p.write_text(s.replace(pos, pos + '\n                while (std.mem.eql(u8, builtin.zig_version_string, "0.16.0")) std.atomic.spinLoopHint();'))
          PYTHON
          check_timeout wedged-protocol
          grep -F 'test runner failed to respond for' wedged-protocol-build.log
          tail -1 wedged-protocol.log | grep -F 'sending metadata'
