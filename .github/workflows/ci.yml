name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue (doc/CI_DESIGN.md §3) runs the required jobs on each
  # group: main plus the queued PRs, merged in order.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read # the version state gate reads the PR's current labels

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Topology: one job per platform on GitHub-hosted runners (the repository is
# public; organization policy keeps public repositories off the self-hosted
# fleet, and hosted standard runners are free for public repositories).
# Cross-platform parallelism comes from the matrix; intra-platform steps run
# cheapest-first for fail-fast. Every runner is ephemeral: nothing persists
# between runs except what actions/cache and setup-zig restore explicitly.
jobs:
  # A release or reopen PR adds only what scripts/release_cut.py generates.
  # When that is proven against the merge commit, and the base commit already
  # passed this workflow's full run on main, the three required jobs below
  # report success without running the suites again: their steps check
  # FAST_PATH, except the checkout and the version state gate in `gates`.
  # Every other PR, every push, and every doubt (the script never fails the
  # job; an error decides the full path) runs everything.
  # doc/RELEASE_AUTOMATION_DESIGN.md §3, "CI fast path".
  release-fast-path:
    name: Release fast path
    # 50 minutes: a reopen PR is opened while main's run of the release merge
    # commit is still going; the script waits up to 45 minutes for it.
    timeout-minutes: 50
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # the base commit's push run of this workflow
    outputs:
      fast: ${{ steps.decide.outputs.fast }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      # Depth 2: the merge commit and both parents; on a pull request HEAD^1
      # is the base.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        with:
          fetch-depth: 2
      # In a merge queue the base is the group's base_sha, which is HEAD^1
      # only for a group of one PR: a bump queued behind other PRs adds their
      # changes to the base and takes the full path. A failed fetch leaves the
      # base unknown to git, which the script reports as the full path.
      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request) base=HEAD^1 ;;
            merge_group)
              git fetch -q --no-tags --depth=1 origin "$MERGE_GROUP_BASE_SHA" || echo "could not fetch the merge group base $MERGE_GROUP_BASE_SHA"
              base="$MERGE_GROUP_BASE_SHA"
              ;;
            *)
              printf 'fast=false\nreason=full path: %s run\n' "$GITHUB_EVENT_NAME" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          python3 scripts/release_fast_path.py --base "$base" --candidate HEAD --repository "$GITHUB_REPOSITORY" --github-output "$GITHUB_OUTPUT" --wait-seconds 2700

  # Which suites the change can affect: scripts/ci_scope.py,
  # doc/CI_DESIGN.md §2. Only documentation changed: the gates run the
  # documentation, version-state and gate-manifest checks and nothing that
  # builds. Only documentation and the evaluation harness changed: the gates
  # run in full and the TTY suites do not. The required jobs below still run
  # and report under their own names; their steps read SUITES / TTY, as they
  # read FAST_PATH. A failed decision leaves both empty: everything runs.
  scope:
    name: Change scope
    timeout-minutes: 10
    runs-on: ubuntu-latest
    outputs:
      suites: ${{ steps.decide.outputs.suites }}
      tty: ${{ steps.decide.outputs.tty }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
      - name: Decide
        id: decide
        env:
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request) base=HEAD^1 ;;
            merge_group)
              git fetch -q --no-tags --depth=1 origin "$MERGE_GROUP_BASE_SHA" || echo "could not fetch the merge group base $MERGE_GROUP_BASE_SHA"
              base="$MERGE_GROUP_BASE_SHA"
              ;;
            *) base="" ;;
          esac
          python3 scripts/ci_scope.py --event "$GITHUB_EVENT_NAME" --base "$base" --candidate HEAD --github-output "$GITHUB_OUTPUT"

  gates:
    name: Gates (${{ matrix.os }})
    # This job's steps are a superset of the AGENTS.md "Before submitting"
    # checklist; scripts/tests/test_gate_manifest.py asserts that every checklist
    # command has a step here, so the two cannot drift apart silently.
    # 45 minutes: a cold hosted runner compiles the whole tree and the Lean
    # kernel; warm runs (setup-zig + Lean cache hits) are far shorter.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux
            runner: ubuntu-latest
          - os: macOS
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    needs: [release-fast-path, scope]
    # A failed decision leaves FAST_PATH and SUITES empty: run in full rather
    # than skip.
    if: ${{ !cancelled() }}
    env:
      FAST_PATH: ${{ needs.release-fast-path.outputs.fast }}
      # 'false' only for a documentation-only change: the steps that also run
      # then are the checkout, the version state gate and the documentation
      # and gate-manifest checks (scripts/tests/test_ci_scope.py pins the list).
      SUITES: ${{ needs.scope.outputs.suites }}
    steps:
      - name: Release fast path
        env:
          REASON: ${{ needs.release-fast-path.outputs.reason }}
        run: echo "$REASON"
      - name: Change scope
        env:
          REASON: ${{ needs.scope.outputs.reason }}
        run: echo "$REASON"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # use-cache: setup-zig points both Zig cache env vars at one directory
      # and restores/saves it through actions/cache keyed by OS and Zig
      # version. Zig's cache is content-addressed and folds the compiler
      # version into every hash, so a restored directory is always safe; test
      # execution is not affected because test Run steps are has_side_effects
      # in build.zig. cache-size-limit: the directory is dropped instead of
      # saved once it exceeds this many MiB (the default 2 GiB is below what
      # one full run of these gates produces).
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        if: env.FAST_PATH != 'true' && env.SUITES != 'false'
        with:
          version: 0.16.0
          use-cache: true
          cache-size-limit: 4096
      - name: Zig format check
        if: runner.os == 'Linux' && env.FAST_PATH != 'true' && env.SUITES != 'false'
        run: zig fmt --check build.zig src tests
      # Lean toolchain and build products. Key: the pinned toolchain plus every
      # Lean source, so a source change rebuilds from the previous products
      # (restore-keys) and Lake hash-verifies what it restores; a stale or
      # torn copy self-heals into a rebuild rather than wrong results.
      - name: Restore Lean toolchain and build products
        if: env.FAST_PATH != 'true' && env.SUITES != 'false'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.elan
            control-plane/lean/.lake
          key: lean-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('control-plane/lean/lean-toolchain', 'control-plane/lean/lakefile.toml', 'control-plane/lean/lake-manifest.json', 'control-plane/lean/**/*.lean') }}
          restore-keys: |
            lean-${{ runner.os }}-${{ runner.arch }}-
      # scripts/ci/install-elan.sh: a pinned elan release asset with a pinned
      # SHA-256, never the mutable elan-init.sh from elan's master branch (the
      # reason lean-action was dropped). A no-op on a cache hit. The toolchain
      # named in control-plane/lean/lean-toolchain installs on first use
      # through elan's own resolver into ~/.elan, which the cache above
      # persists.
      - name: Install pinned elan
        if: env.FAST_PATH != 'true' && env.SUITES != 'false'
        run: bash scripts/ci/install-elan.sh
      - name: Build pinned Lean kernel
        if: env.FAST_PATH != 'true' && env.SUITES != 'false'
        shell: bash
        run: |
          set -euo pipefail
          (cd control-plane/lean && lake build)
          # The project-harness kernel is linked and smoked by its build
          # script, not by `lake build`: the smoke requests are hand-written
          # canonical JSON that the strict Lean parser must accept field for
          # field, and nothing else exercises that pairing. They drifted from
          # the kernel for three weeks (within_root, 33cf238) because no job
          # ran the script on any platform. The output goes outside the
          # workspace so no test can pick up a kernel that the suite did not
          # stage itself. One line: test_gate_manifest.py shlex-splits every
          # line of this block on its own.
          LAKE="$(command -v lake)" bash scripts/build-project-harness-kernel.sh "$RUNNER_TEMP/metacodes-project-kernel"
      - name: Install ripgrep
        if: env.FAST_PATH != 'true' && env.SUITES != 'false'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rg >/dev/null 2>&1; then
            if [[ "$RUNNER_OS" == "macOS" ]]; then
              brew install ripgrep
            else
              sudo apt-get update
              sudo apt-get install -y ripgrep
            fi
          fi
      # scripts/build_project_rule.py isolates a candidate rule's Lean build in
      # bubblewrap on Linux (sandbox-exec on macOS); the native project-Harness
      # suites `zig build test` wires when bwrap is present exercise it.
      # Ubuntu 24.04 confines unprivileged user namespaces through AppArmor,
      # so bwrap needs that lifted; the smoke runs the builder's own flags so
      # a broken sandbox fails here instead of deep in the suite.
      - name: Install bubblewrap
        if: runner.os == 'Linux' && env.FAST_PATH != 'true' && env.SUITES != 'false'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y bubblewrap
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          sandbox=(--unshare-all --die-with-parent --new-session --proc /proc --dev /dev --tmpfs /tmp)
          runtime=(--ro-bind /usr /usr --symlink usr/bin /bin --symlink usr/lib /lib --symlink usr/lib64 /lib64)
          bwrap "${sandbox[@]}" "${runtime[@]}" /bin/true
      # PyYAML for scripts/eval/workbuddy and its tests (requirements-dev.txt).
      # --break-system-packages: the hosted images' system Python is PEP 668
      # "externally managed"; the runner is ephemeral so there is nothing to
      # protect.
      - name: Install Python development dependencies
        if: env.FAST_PATH != 'true'
        run: python3 -m pip install --break-system-packages -r requirements-dev.txt
      # A version without -dev is legal only on its tagged commit, the release
      # PR, or main's run of the release merge commit; in the latter two the
      # gate tags HEAD locally so the release-layout steps below can run the
      # stable channel on the candidate (doc/RELEASE_AUTOMATION_DESIGN.md §3).
      # The labels are read now, not taken from the event: `gh pr create
      # --label` adds the label after it creates the PR, and the `opened`
      # payload of release: 0.2.1 (#176) carried none, so the gate refused
      # its own release PR. On the release fast path this and the checkout are
      # the only steps that run, so the gate skips the rehearsal tag. A merge
      # queue group carries no PR in its event: its ref names the PR at its
      # head, the newest entry (gh-readonly-queue/<base>/pr-<n>-<sha>), and
      # the gate judges that PR's head branch, title and labels. So the
      # release PR passes only as its group's head, and a PR queued behind it
      # sees the bare version and is refused, exactly as it would be on main
      # (doc/CI_DESIGN.md §3; it relies on the queue's ALLGREEN setting).
      - name: Version state gate and release rehearsal
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR_NUMBER: ${{ github.event.pull_request.number }}
          RELEASE_PR_TITLE: ${{ github.event.pull_request.title }}
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          if [ -n "$MERGE_GROUP_HEAD_REF" ]; then
            if [[ ! "$MERGE_GROUP_HEAD_REF" =~ /pr-([0-9]+)-[0-9a-f]+$ ]]; then
              echo "not a merge queue ref: $MERGE_GROUP_HEAD_REF" >&2
              exit 1
            fi
            RELEASE_PR_NUMBER=${BASH_REMATCH[1]}
            GITHUB_HEAD_REF=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$RELEASE_PR_NUMBER" --jq .head.ref)
            RELEASE_PR_TITLE=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$RELEASE_PR_NUMBER" --jq .title)
            export GITHUB_HEAD_REF RELEASE_PR_TITLE
          fi
          if [ -n "$RELEASE_PR_NUMBER" ]; then
            RELEASE_PR_LABELS=$(gh api "repos/$GITHUB_REPOSITORY/issues/$RELEASE_PR_NUMBER/labels" --jq '[.[].name] | join(",")')
            export RELEASE_PR_LABELS
          fi
          if [ "$FAST_PATH" = "true" ]; then
            python3 scripts/check_version_state.py
          else
            python3 scripts/check_version_state.py --rehearse
          fi
      - name: TinyKG binary-contract unit tests
        if: env.FAST_PATH != 'true' && env.SUITES != 'false'
        run: python3 -m unittest scripts.tests.test_stage_tinykg_binary -v
      - name: ripgrep binary-contract unit tests
        if: env.FAST_PATH != 'true' && env.SUITES != 'false'
        run: python3 -m unittest scripts.tests.test_stage_ripgrep_binary -v
      - name: Trajectory audit unit tests
        if: env.FAST_PATH != 'true' && env.SUITES != 'false'
        run: python3 -m unittest scripts.tests.test_audit_trajectories -v
      - name: Verify native bundle and fresh-store contract
        if: env.FAST_PATH != 'true' && env.SUITES != 'false'
        shell: bash
        run: |
          python3 scripts/verify_tinykg_binary.py
          python3 scripts/verify_ripgrep_binary.py
          zig build tinykg:stage
      # Both vendored runtime assets stage for aarch64-linux (#86): the
      # target's rg is the upstream aarch64 musl binary, first published with
      # ripgrep 15.x. A complete aarch64-linux release unit (manifest v2) also
      # needs both Lean kernels, which only a native aarch64 runner can build,
      # so this leg proves the cross-staged assets and the release unit waits
      # for that runner (doc/INSTALL_DESIGN.md §5).
      - name: Verify Linux arm64 cross-stage contract
        if: runner.os == 'Linux' && env.FAST_PATH != 'true' && env.SUITES != 'false'
        run: |
          zig build tinykg:stage -Dtarget=aarch64-linux-musl
          zig build install -Dtarget=aarch64-linux-musl -Drelease-layout=true --prefix "$RUNNER_TEMP/stage-aarch64-linux"
      - name: Native platform modules
        if: env.FAST_PATH != 'true' && env.SUITES != 'false'
        shell: bash
        env:
          METACODES_PROC_TEST: "1"
        run: |
          set -euo pipefail
          for module in sync fs rng paths signal process net dir exe_lookup; do
            zig test "src/platform/${module}.zig" -lc
          done
      # The installed-adapter WorkBuddy suites (scripts/eval/tests/
      # test_workbuddy_adapter.py) run the overlay inside the real pinned
      # WorkBuddy-Bench, against its locked environment; without a checkout
      # they skip. provision_checkout.sh fetches the pinned commit, installs
      # this repository's overlay and `uv sync`s it; the suite below inherits
      # METACODES_WORKBUDDY_CHECKOUT through zig build.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: env.FAST_PATH != 'true' && env.SUITES != 'false'
        with:
          version: "0.11.19"
      - name: Provision the pinned WorkBuddy-Bench checkout
        if: env.FAST_PATH != 'true' && env.SUITES != 'false'
        shell: bash
        run: |
          set -euo pipefail
          checkout=$(scripts/eval/workbuddy/provision_checkout.sh "$RUNNER_TEMP/workbuddy-bench")
          echo "METACODES_WORKBUDDY_CHECKOUT=$checkout" >> "$GITHUB_ENV"
      - name: Full offline test suite
        if: env.FAST_PATH != 'true' && env.SUITES != 'false'
        env:
          # Both legs build control-plane/lean above, so a missing/mislocated
          # ProjectRule.olean is a regression, not an environment gap: fail
          # instead of skip.
          METACODES_TEST_REQUIRE_LEAN_SDK: "1"
        # --test-timeout 5m: the build runner watchdog between tests is
        # max(--test-timeout, 60s); same value as the Windows leg and the
        # AgentCore gate, so a wedged test on a loaded runner is reported
        # instead of eating the job timeout. -Dlean-kernels=on: the suite
        # builds both kernels from this checkout and every kernel-gated test
        # runs; a missing toolchain fails the build instead of skipping them.
        run: zig build test --test-timeout 5m -Dlean-kernels=on
      - name: ReleaseSafe core gate
        if: runner.os == 'Linux' && env.FAST_PATH != 'true' && env.SUITES != 'false'
        run: zig build test:lib -Doptimize=ReleaseSafe
      - name: Repository coverage audit
        if: runner.os == 'Linux' && env.FAST_PATH != 'true' && env.SUITES != 'false'
        run: scripts/test_coverage_audit.sh
      - name: Documentation link check
        if: runner.os == 'Linux' && env.FAST_PATH != 'true'
        run: python3 scripts/check_doc_links.py
      - name: Default install prefix
        if: env.FAST_PATH != 'true' && env.SUITES != 'false'
        run: zig build --prefix "$RUNNER_TEMP/install-prefix" && python3 scripts/verify_install_prefix.py "$RUNNER_TEMP/install-prefix" --doctor
      # The sidecar the kernel build script wrote, read by the installed
      # product's own loader: the pairing no unit test can cover (the project
      # kernel's v6 sidecar was validated with the formal v4 loader for as long
      # as nothing ran a real one through doctor, 2026-09-21).
      - name: Built project kernel provenance is accepted by doctor
        if: env.FAST_PATH != 'true' && env.SUITES != 'false'
        run: python3 scripts/verify_kernel_provenance.py "$RUNNER_TEMP/install-prefix/bin/metacodes" --project "$RUNNER_TEMP/metacodes-project-kernel"
      # Manifest v2 ships both Lean kernels and pins them, so the release
      # layout is two invocations (release/LAYOUT.md): stage the kernels, then
      # build the executable with their digests. KERNEL_PINS carries them to
      # the archive steps.
      - name: Stage Lean kernels for the release layout
        if: env.FAST_PATH != 'true' && env.SUITES != 'false'
        shell: bash
        run: |
          set -euo pipefail
          zig build kernels:stage -Dlean-kernels=on --prefix "$RUNNER_TEMP/release-prefix"
          pins=$(python3 scripts/kernel_pins.py "$RUNNER_TEMP/release-prefix")
          echo "KERNEL_PINS=$pins" >> "$GITHUB_ENV"
      - name: Release layout prefix
        if: env.FAST_PATH != 'true' && env.SUITES != 'false'
        run: zig build release:verify -Drelease-layout=true --prefix "$RUNNER_TEMP/release-prefix" $KERNEL_PINS && python3 scripts/verify_install_prefix.py "$RUNNER_TEMP/release-prefix" --release --doctor
      # The installer, through the same script users run, on the verified
      # unit: every file re-verified at the new prefix, an install record and
      # state root of its own, and the installed executable's doctor --strict.
      - name: Install the release unit with scripts/install.sh
        if: env.FAST_PATH != 'true' && env.SUITES != 'false'
        run: sh scripts/install.sh --no-link --prefix "$RUNNER_TEMP/installed" "$RUNNER_TEMP/release-prefix" && "$RUNNER_TEMP/installed/bin/metacodes" doctor --strict
      - name: Release bundle verifier self-test
        if: env.FAST_PATH != 'true' && env.SUITES != 'false'
        run: python3 scripts/verify_release_bundle.py --self-test
      - name: Release archive is reproducible
        if: env.FAST_PATH != 'true' && env.SUITES != 'false'
        run: |
          zig build release:archive -Drelease-layout=true --prefix "$RUNNER_TEMP/release-prefix" $KERNEL_PINS -Drelease-archive-dir="$RUNNER_TEMP/dist-1"
          zig build release:archive -Drelease-layout=true --prefix "$RUNNER_TEMP/release-prefix" $KERNEL_PINS -Drelease-archive-dir="$RUNNER_TEMP/dist-2"
          if ! cmp "$RUNNER_TEMP"/dist-1/metacodes-*.tar.gz "$RUNNER_TEMP"/dist-2/metacodes-*.tar.gz; then
            # Evidence for the next mismatch: which members differ.
            mkdir -p "$RUNNER_TEMP/unpacked-1" "$RUNNER_TEMP/unpacked-2"
            tar -xzf "$RUNNER_TEMP"/dist-1/metacodes-*.tar.gz -C "$RUNNER_TEMP/unpacked-1"
            tar -xzf "$RUNNER_TEMP"/dist-2/metacodes-*.tar.gz -C "$RUNNER_TEMP/unpacked-2"
            diff -rq "$RUNNER_TEMP/unpacked-1" "$RUNNER_TEMP/unpacked-2" || true
            cat "$RUNNER_TEMP"/unpacked-*/*/libexec/metacodes/*.build-receipt.json || true
            exit 1
          fi
          zig build release:sums -Drelease-layout=true --prefix "$RUNNER_TEMP/release-prefix" $KERNEL_PINS -Drelease-archive-dir="$RUNNER_TEMP/dist-1"
          cat "$RUNNER_TEMP"/dist-1/metacodes-*-SHA256SUMS
      - name: Third-party notices check
        if: runner.os == 'Linux' && env.FAST_PATH != 'true' && env.SUITES != 'false'
        run: python3 scripts/gen_third_party_notices.py --check
      - name: Documentation fact check
        if: runner.os == 'Linux' && env.FAST_PATH != 'true'
        run: python3 scripts/check_doc_facts.py
      - name: Documentation fact-check unit tests
        if: env.FAST_PATH != 'true'
        run: python3 -m unittest scripts.tests.test_check_doc_facts -v
      - name: Third-party notices unit tests
        if: env.FAST_PATH != 'true' && env.SUITES != 'false'
        run: python3 -m unittest scripts.tests.test_gen_third_party_notices -v
      - name: Gate manifest unit tests
        if: env.FAST_PATH != 'true'
        run: python3 -m unittest scripts.tests.test_gate_manifest -v
      - name: Verify install prefix unit tests
        if: env.FAST_PATH != 'true' && env.SUITES != 'false'
        run: python3 -m unittest scripts.tests.test_verify_install_prefix -v
      - name: Install script unit tests
        if: env.FAST_PATH != 'true' && env.SUITES != 'false'
        run: python3 -m unittest scripts.tests.test_install_scripts -v
      - name: Kernel self-containment and pin unit tests
        if: env.FAST_PATH != 'true' && env.SUITES != 'false'
        run: python3 -m unittest scripts.tests.test_check_kernel_self_contained scripts.tests.test_kernel_pins -v
      - name: Kernel provenance verifier unit tests
        if: env.FAST_PATH != 'true' && env.SUITES != 'false'
        run: python3 -m unittest scripts.tests.test_verify_kernel_provenance -v
      - name: Python floor unit tests
        if: env.FAST_PATH != 'true' && env.SUITES != 'false'
        run: python3 -m unittest scripts.tests.test_python_floor -v
      - name: Release cut unit tests
        if: env.FAST_PATH != 'true' && env.SUITES != 'false'
        run: python3 -m unittest scripts.tests.test_release_cut -v
      - name: Release fast path unit tests
        if: env.FAST_PATH != 'true' && env.SUITES != 'false'
        run: python3 -m unittest scripts.tests.test_release_fast_path -v
      - name: Change scope unit tests
        if: env.FAST_PATH != 'true' && env.SUITES != 'false'
        run: python3 -m unittest scripts.tests.test_ci_scope -v
      - name: Diff whitespace check
        if: env.FAST_PATH != 'true'
        run: git diff --check

  # The Python and Node packages over the AgentCore shared library (sdk/python,
  # sdk/node). Not a required check yet: it builds a ReleaseSafe bundle, which
  # the required gates do not, then runs both packages' end-to-end suites
  # against a loopback mock provider (no network, no key), including the
  # installed wheel in a clean virtualenv. Windows waits for the Node addon's
  # Windows port.
  sdk-bindings:
    name: SDK bindings (${{ matrix.os }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux
            runner: ubuntu-latest
            target: x86_64-linux-gnu
          - os: macOS
            runner: macos-latest
            target: aarch64-macos
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
          use-cache: true
          cache-size-limit: 4096
      - name: Build the AgentCore bundle
        run: |
          zig build agentcore:bundle -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe --prefix "$RUNNER_TEMP/sdk"
          bundle=$(ls -d "$RUNNER_TEMP"/sdk/agentcore/*/ | head -n 1)
          echo "BUNDLE=$bundle" >> "$GITHUB_ENV"
          echo "AGENTCORE_LIB=$(python3 -c 'import json,os,sys; b=sys.argv[1]; print(os.path.join(b, json.load(open(os.path.join(b, "manifest.json")))["shared_library"]["path"]))' "$bundle")" >> "$GITHUB_ENV"
      - name: Python package end-to-end suite
        env:
          METACODES_PY_SDK_REQUIRE_LIB: "1"
        run: METACODES_AGENTCORE_LIB="$AGENTCORE_LIB" python3 -m unittest discover -s sdk/python/tests -v
      - name: Python wheel installs and passes the suite from site-packages
        env:
          METACODES_PY_SDK_REQUIRE_LIB: "1"
          METACODES_PY_SDK_TEST_INSTALLED: "1"
        run: |
          python3 sdk/python/build_wheel.py --bundle "$BUNDLE" --out "$RUNNER_TEMP/wheels"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --no-index "$RUNNER_TEMP"/wheels/*.whl
          mkdir -p "$RUNNER_TEMP/empty-home"
          cd "$RUNNER_TEMP"
          HOME="$RUNNER_TEMP/empty-home" "$RUNNER_TEMP/venv/bin/python" -m unittest discover -s "$GITHUB_WORKSPACE/sdk/python/tests" -v
      - name: Node addon builds against this Node's headers
        run: |
          node --version
          node sdk/node/scripts/build.js --bundle "$BUNDLE"
      - name: Node package end-to-end suite
        env:
          METACODES_NODE_SDK_REQUIRE_LIB: "1"
        run: node --test sdk/node/test/metacodes.test.js

  # The offline TTY suite (tests/tty) drives the debug binary in a pseudo
  # terminal and asserts the screen a person would see. No workflow ran it
  # before #222: twelve agent-tree cases stayed red for weeks (#218), and a
  # Windows-only service stall looked like a slow machine. Run the cases with
  # Python directly on POSIX (tests/tty/README.md: the build runner's stdio
  # supervision disturbs pty timing); Windows goes through `windows:tty`.
  tty:
    name: TTY (${{ matrix.os }})
    # 60 minutes: about 12 minutes of cases on POSIX and 25 under ConPTY,
    # plus a cold debug build.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux
            runner: ubuntu-latest
          - os: Windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    needs: [release-fast-path, scope]
    # A failed decision leaves FAST_PATH and TTY empty: run in full rather
    # than skip.
    if: ${{ !cancelled() }}
    env:
      FAST_PATH: ${{ needs.release-fast-path.outputs.fast }}
      # 'false' for a change confined to documentation and the evaluation
      # harness, which the TTY suites neither build nor read.
      TTY: ${{ needs.scope.outputs.tty }}
    steps:
      - name: Release fast path
        env:
          REASON: ${{ needs.release-fast-path.outputs.reason }}
        run: echo "$REASON"
      - name: Change scope
        env:
          REASON: ${{ needs.scope.outputs.reason }}
        run: echo "$REASON"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: env.FAST_PATH != 'true' && env.TTY != 'false'
      # The binary embeds files byte for byte; see `windows-gates`.
      - name: Normalize line endings of the checkout
        if: runner.os == 'Windows' && env.FAST_PATH != 'true' && env.TTY != 'false'
        shell: cmd
        run: |
          git config core.autocrlf false && git rm -q --cached -r . && git reset -q --hard
          git ls-files --eol | findstr /R "w/crlf w/mixed" && exit /b 1
          exit /b 0
      # See the `gates` job for the cache semantics.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        if: env.FAST_PATH != 'true' && env.TTY != 'false'
        with:
          version: 0.16.0
          use-cache: true
          cache-size-limit: 4096
      - name: Offline TTY suite (POSIX pty)
        if: runner.os != 'Windows' && env.FAST_PATH != 'true' && env.TTY != 'false'
        env:
          TTY_SKIP_MODEL: "1"
        run: |
          zig build dev test:harness
          python3 tests/tty/run_tty_tests.py --bin zig-out/bin/metacodes-debug
      # pywinpty provides the ConPTY backend of tests/tty/tty_driver.py; the
      # version the Windows failures of #218-#220 were measured with.
      - name: Offline TTY suite (ConPTY)
        if: runner.os == 'Windows' && env.FAST_PATH != 'true' && env.TTY != 'false'
        shell: cmd
        run: |
          python -m pip install pywinpty==3.0.5 || exit /b 1
          zig build windows:tty -Dtarget=x86_64-windows-gnu

  windows-gates:
    name: Gates (Windows)
    # 45 minutes: same reasoning as the `gates` job; the hosted Windows runner
    # has 4 cores and a cold Zig cache compiles the whole tree.
    timeout-minutes: 45
    runs-on: windows-latest
    needs: [release-fast-path, scope]
    # A failed decision leaves FAST_PATH and SUITES empty: run in full rather
    # than skip.
    if: ${{ !cancelled() }}
    env:
      FAST_PATH: ${{ needs.release-fast-path.outputs.fast }}
      # 'false' only for a documentation-only change; the version state gate
      # and the documentation checks of `gates` cover it, so nothing runs here.
      SUITES: ${{ needs.scope.outputs.suites }}
    steps:
      - name: Release fast path
        env:
          REASON: ${{ needs.release-fast-path.outputs.reason }}
        run: echo "$REASON"
      - name: Change scope
        env:
          REASON: ${{ needs.scope.outputs.reason }}
        run: echo "$REASON"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: env.FAST_PATH != 'true' && env.SUITES != 'false'
        with:
          # Same as the `gates` job: the repository-snapshot and grounding
          # fingerprint tests resolve historical commits with `git rev-parse`,
          # which a depth-1 checkout cannot (5 errors on the first full run).
          fetch-depth: 0
      # See the `gates` job for the cache semantics.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        if: env.FAST_PATH != 'true' && env.SUITES != 'false'
        with:
          version: 0.16.0
          use-cache: true
          cache-size-limit: 4096
      # The hosted Windows image checks out with core.autocrlf=true, and
      # .gitattributes (`* text=auto eol=lf`) is the contract: @embedFile'd
      # templates and pinned fixtures hash by the byte. List what is wrong for
      # the record, rewrite the tree from the index under .gitattributes, and
      # fail closed if anything still carries CRLF. cmd throughout the job:
      # Git-Bash $HOME would be a POSIX-style path that native zig.exe cannot
      # use.
      - name: Normalize line endings of the checkout
        if: env.FAST_PATH != 'true' && env.SUITES != 'false'
        shell: cmd
        run: |
          git config --show-origin --get-all core.autocrlf & echo (core.autocrlf origins above, if any)
          git ls-files --eol | findstr /R "w/crlf w/mixed" & echo (CRLF worktree files before normalization above, if any)
          git config core.autocrlf false && git rm -q --cached -r . && git reset -q --hard
          git ls-files --eol | findstr /R "w/crlf w/mixed" && exit /b 1
          exit /b 0
      # PyYAML for the Python suites that `zig build test` runs; see the
      # `gates` job.
      - name: Install Python development dependencies
        if: env.FAST_PATH != 'true' && env.SUITES != 'false'
        shell: cmd
        run: python -m pip install -r requirements-dev.txt
      - name: Native platform modules
        if: env.FAST_PATH != 'true' && env.SUITES != 'false'
        shell: cmd
        env:
          METACODES_PROC_TEST: "1"
        run: >-
          zig test src/platform/sync.zig -lc &&
          zig test src/platform/fs.zig -lc &&
          zig test src/platform/rng.zig -lc &&
          zig test src/platform/paths.zig -lc &&
          zig test src/platform/signal.zig -lc &&
          zig test src/platform/process.zig -lc &&
          zig test src/platform/net.zig -lc &&
          zig test src/platform/dir.zig -lc &&
          zig test src/platform/exe_lookup.zig -lc
      # Current labels and the merge queue's head PR, as in the `gates` job;
      # bash for the same script.
      - name: Version state gate and release rehearsal
        if: env.FAST_PATH != 'true' && env.SUITES != 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR_NUMBER: ${{ github.event.pull_request.number }}
          RELEASE_PR_TITLE: ${{ github.event.pull_request.title }}
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          if [ -n "$MERGE_GROUP_HEAD_REF" ]; then
            if [[ ! "$MERGE_GROUP_HEAD_REF" =~ /pr-([0-9]+)-[0-9a-f]+$ ]]; then
              echo "not a merge queue ref: $MERGE_GROUP_HEAD_REF" >&2
              exit 1
            fi
            RELEASE_PR_NUMBER=${BASH_REMATCH[1]}
            GITHUB_HEAD_REF=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$RELEASE_PR_NUMBER" --jq .head.ref)
            RELEASE_PR_TITLE=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$RELEASE_PR_NUMBER" --jq .title)
            export GITHUB_HEAD_REF RELEASE_PR_TITLE
          fi
          if [ -n "$RELEASE_PR_NUMBER" ]; then
            RELEASE_PR_LABELS=$(gh api "repos/$GITHUB_REPOSITORY/issues/$RELEASE_PR_NUMBER/labels" --jq '[.[].name] | join(",")')
            export RELEASE_PR_LABELS
          fi
          python scripts/check_version_state.py --rehearse
      - name: Verify native bundle and fresh-store contract
        if: env.FAST_PATH != 'true' && env.SUITES != 'false'
        shell: cmd
        run: python scripts/verify_tinykg_binary.py && python scripts/verify_ripgrep_binary.py && zig build tinykg:stage
      # The Windows release unit ships both Lean kernels too (manifest v2), so
      # this leg provisions the same pinned elan and Lean cache as `gates`;
      # the kernel scripts run under Git Bash (kernels:stage invokes bash).
      - name: Restore Lean toolchain and build products
        if: env.FAST_PATH != 'true' && env.SUITES != 'false'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.elan
            control-plane/lean/.lake
          key: lean-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('control-plane/lean/lean-toolchain', 'control-plane/lean/lakefile.toml', 'control-plane/lean/lake-manifest.json', 'control-plane/lean/**/*.lean') }}
          restore-keys: |
            lean-${{ runner.os }}-${{ runner.arch }}-
      - name: Install pinned elan
        if: env.FAST_PATH != 'true' && env.SUITES != 'false'
        shell: bash
        run: bash scripts/ci/install-elan.sh
      - name: Stage Lean kernels for the release layout
        if: env.FAST_PATH != 'true' && env.SUITES != 'false'
        shell: cmd
        run: |
          zig build kernels:stage -Dlean-kernels=on --prefix "%RUNNER_TEMP%\release-prefix" || exit /b 1
          for /f "delims=" %%P in ('python scripts\kernel_pins.py "%RUNNER_TEMP%\release-prefix"') do echo KERNEL_PINS=%%P>> "%GITHUB_ENV%"
          findstr /B KERNEL_PINS= "%GITHUB_ENV%" || exit /b 1
      - name: Default install prefix
        if: env.FAST_PATH != 'true' && env.SUITES != 'false'
        shell: cmd
        run: zig build --prefix "%RUNNER_TEMP%\install-prefix" && python scripts\verify_install_prefix.py "%RUNNER_TEMP%\install-prefix" --doctor
      - name: Release layout prefix
        if: env.FAST_PATH != 'true' && env.SUITES != 'false'
        shell: cmd
        run: zig build release:verify -Drelease-layout=true --prefix "%RUNNER_TEMP%\release-prefix" %KERNEL_PINS% && python scripts\verify_install_prefix.py "%RUNNER_TEMP%\release-prefix" --release --doctor
      - name: Install the release unit with scripts/install.ps1
        if: env.FAST_PATH != 'true' && env.SUITES != 'false'
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\install.ps1 "%RUNNER_TEMP%\release-prefix" -Prefix "%RUNNER_TEMP%\installed" -NoPath && "%RUNNER_TEMP%\installed\bin\metacodes.exe" doctor --strict
      - name: Release bundle verifier self-test
        if: env.FAST_PATH != 'true' && env.SUITES != 'false'
        shell: cmd
        run: python scripts\verify_release_bundle.py --self-test
      - name: Release archive is reproducible
        if: env.FAST_PATH != 'true' && env.SUITES != 'false'
        shell: cmd
        run: zig build release:archive -Drelease-layout=true --prefix "%RUNNER_TEMP%\release-prefix" %KERNEL_PINS% -Drelease-archive-dir="%RUNNER_TEMP%\dist-1" && zig build release:archive -Drelease-layout=true --prefix "%RUNNER_TEMP%\release-prefix" %KERNEL_PINS% -Drelease-archive-dir="%RUNNER_TEMP%\dist-2" && python scripts\release_sums.py --self-test && for %%F in ("%RUNNER_TEMP%\dist-1\metacodes-*.zip") do fc /b "%%F" "%RUNNER_TEMP%\dist-2\%%~nxF" > nul && zig build release:sums -Drelease-layout=true --prefix "%RUNNER_TEMP%\release-prefix" %KERNEL_PINS% -Drelease-archive-dir="%RUNNER_TEMP%\dist-1"
      - name: Verify install prefix unit tests
        if: env.FAST_PATH != 'true' && env.SUITES != 'false'
        shell: cmd
        run: python -m unittest scripts.tests.test_verify_install_prefix -v
      - name: Install script unit tests
        if: env.FAST_PATH != 'true' && env.SUITES != 'false'
        shell: cmd
        run: python -m unittest scripts.tests.test_install_scripts -v
      - name: Kernel provenance verifier unit tests
        if: env.FAST_PATH != 'true' && env.SUITES != 'false'
        shell: cmd
        run: python -m unittest scripts.tests.test_verify_kernel_provenance -v
      # The repository-wide suite on the native Windows host (#53), with the
      # kernels this leg built above (-Dlean-kernels=on). No
      # METACODES_TEST_REQUIRE_LEAN_SDK here: the Python Lean-SDK suites stay
      # POSIX-only (scripts/eval/tests/posix_only.py), and the component tests
      # that drive a kernel through POSIX-only paths skip on Windows as before.
      # --test-timeout 5m: the build runner watchdog between tests is
      # max(--test-timeout, 60s), same as the AgentCore gate.
      - name: Full offline test suite
        if: env.FAST_PATH != 'true' && env.SUITES != 'false'
        shell: cmd
        run: zig build test --test-timeout 5m -Dlean-kernels=on
      # Evidence for the next line-ending incident: if the suite itself rewrites
      # tracked files with CRLF, this lists them; the step never fails.
      - name: Line endings after the suite
        if: always() && env.FAST_PATH != 'true' && env.SUITES != 'false'
        shell: cmd
        run: |
          git ls-files --eol | findstr /R "w/crlf w/mixed" & echo (CRLF worktree files after the suite above, if any)
          exit /b 0
