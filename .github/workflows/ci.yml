name: Windows picker comparison
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Commit to test
        required: true
permissions:
  contents: read
jobs:
  picker:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.16.0
          use-cache: false
      - shell: cmd
        env:
          METACODES_PICKER_TRACE: ${{ runner.temp }}\picker.log
        run: zig build test:picker -j8 --seed 0x3e68a003 --test-timeout 5m -Dlean-kernels=on --summary all
      - if: always()
        shell: pwsh
        run: |
          $trace = Join-Path $env:RUNNER_TEMP picker.log
          if (Test-Path $trace) { Get-Content $trace -Tail 12 }
