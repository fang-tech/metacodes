# The Web and Office LLM judge the leaderboard uses, as the maintainers
# published it on Tencent/workbuddy-bench#3 (2026-07-27, Office; Web "the same
# configuration"): Kimi K2.7 Code, thinking on, temperature 1.0, top_p 0.95,
# reasoning_effort low, JSON-object output, a 32768-token output budget.  The
# verifier's own defaults supply the rest (120 s timeout, 2 retries, rubric
# concurrency 4).
#
# Open for Web: the Web maintainer also wrote on #3 that thinking is "high",
# and upstream's configs/bench/wb-bench-web-v1.0.yaml defaults the Web judge
# to `kimi-k2.7-think`.  This file keeps the published Office configuration
# for both subsets until the maintainers say which applies; the ambiguity is
# disclosed with every Web result (evals/experiments/workbuddy-leaderboard-v1.md).
#
# `name` is the backend model id sent upstream.  Upstream's file names it
# `kimi-k2.7` on their gateway; Moonshot's public id is `kimi-k2.7-code`.
# Confirm the spelling in the judge gateway's catalog before a paid run.
#
# The judge spends through METACODES_WORKBUDDY_JUDGE_API_KEY, which the
# launch gate passes only to a launch planned with --judge-budget-usd: the
# cap joins that transaction's reserved maximum and is committed in full.
# The key also keeps a hard gateway quota at the judge cap.
model:
  name: kimi-k2.7-code
  protocols: [openai]
  backend_url_env: METACODES_WORKBUDDY_JUDGE_BASE_URL
  backend_key_env: METACODES_WORKBUDDY_JUDGE_API_KEY
  max_concurrent: 4
  params:
    max_output_tokens: 32768
    temperature: 1.0
    top_p: 0.95
    thinking_enabled: true
    extra_body:
      reasoning_effort: low
      response_format:
        type: json_object
