# GLM-5.2 for the WorkBuddy-Bench leaderboard protocol (technical report §4,
# leaderboard v1.2): provider-default inference parameters, so no temperature
# or top_p is injected; the bench's 200k context window.  Reasoning effort is
# a metacodes flag (METACODES_REASONING_EFFORT in the leaderboard jobs), not a
# request parameter the proxy writes into the body.
#
# max_output_tokens is the one request parameter the proxy injects (as
# max_tokens).  The official per-model records are unpublished (upstream
# issue #12); 32768 matches the September 2026 runs and the official Office
# judge budget and is disclosed with every result.
model:
  name: glm-5.2
  protocols: [anthropic]
  backend_url_env: METACODES_WORKBUDDY_PROVIDER_BASE_URL
  backend_key_env: METACODES_WORKBUDDY_PROVIDER_KEY_FD_REF
  context_window: 200000
  max_concurrent: 1
  params:
    max_output_tokens: 32768
